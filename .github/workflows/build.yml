name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore MisakaTranslator.sln

      - name: Build net472 only
        run: msbuild MisakaTranslator.sln /p:Configuration=Release /p:TargetFramework=net472 /m

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MisakaTranslator-WPF-net472
          path: |
            MisakaTranslator-WPF/bin/Release/net472/**
            MisakaTranslator-WPF/bin/Release/**